plugins {
    id 'com.android.application'
}

def requestedAbis = providers.gradleProperty('scanAbis')
        .orElse('arm64-v8a,x86_64').get().split(',')*.trim()
def scanMinify = providers.gradleProperty('scanMinify').getOrElse('true').toBoolean()
if (requestedAbis.isEmpty() || !requestedAbis.every { it in ['arm64-v8a', 'x86_64'] }) {
    throw new GradleException('scanAbis must contain arm64-v8a and/or x86_64')
}

configurations {
    alignedCppRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

// Use the aligned C++ runtime from the newer AAR. Keep the vision engine on 4.11.
def alignedAar = configurations.alignedCppRuntime.elements.map { files ->
    files.iterator().next().asFile
}
def extractCppRuntime = tasks.register('extractCppRuntime', Sync) {
    from(alignedAar.map { zipTree(it) }) {
        include requestedAbis.collect { 'jni/' + it + '/libc++_shared.so' }
        eachFile { path = path.substring('jni/'.length()) }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('generated/alignedCppRuntime')
}

android {
    namespace 'com.scandesk.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    testBuildType providers.gradleProperty('scanTestBuildType').getOrElse('debug')

    defaultConfig {
        applicationId 'com.scandesk.app'
        minSdk 28
        targetSdk 36
        versionCode 14
        versionName '1.0.0-rc.14'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters.addAll(requestedAbis)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled scanMinify
            shrinkResources scanMinify
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFiles 'proguard-test-rules.pro'
        }
    }

    packaging {
        dex.useLegacyPackaging = true
        // Prefer the app-provided NDK runtime over the 4 KB runtime in OpenCV 4.11.
        jniLibs.pickFirsts.add('**/libc++_shared.so')
    }

    androidResources {
        noCompress += 'onnx'
    }

    sourceSets.main.jniLibs.srcDir(extractCppRuntime.map { it.destinationDir })
}

tasks.named('preBuild').configure { dependsOn(extractCppRuntime) }

dependencies {
    implementation files('libs/paddleocr-textline.jar')
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.customview:customview:1.2.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.87'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.87'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    // OpenCV 4.12's ARM dispatch crashes on Apple Silicon Android emulators (opencv#27618).
    implementation 'org.opencv:opencv:4.11.0'
    alignedCppRuntime 'org.opencv:opencv:4.12.0@aar'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
